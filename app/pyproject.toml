[project]
name = "actiontrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kxran", email = "karan.singh@coditas.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
actiontrack = "actiontrack.cli_app:main"

[project.optional-dependencies]
gmail = [
    "mcp>=2.3.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
